<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Variante 2 — Card Carousel</title>
<style>
  :root {
    --bg: #111318; --card: #1b1e25; --text: #f2f3f6; --dim: #8d93a3; --accent: #33e1b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #08090b; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #device {
    width: 480px; height: 480px; border-radius: 50%; position: relative;
    background: var(--bg); overflow: hidden;
    box-shadow: 0 0 0 6px #1c1c1f, 0 0 40px rgba(0,0,0,0.6);
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* --- Status bar --- */
  .statusbar {
    position: absolute; top: 16px; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 700; color: var(--dim);
  }
  .batt { display:flex; align-items:center; gap:4px; }
  .batt-shell { width:18px; height:9px; border:1px solid var(--dim); border-radius:2px; position:relative; }
  .batt-fill { position:absolute; top:1px; left:1px; bottom:1px; background:var(--accent); border-radius:1px; }
  .dot { width:3px; height:3px; border-radius:50%; background: var(--dim); }
  .bt-on { color: #4fb8ff; }

  /* --- Carousel --- */
  #carousel { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .row {
    position: absolute; left: 50%; display: flex; align-items: center; gap: 14px;
    width: 340px; transition: transform 220ms cubic-bezier(.2,.8,.2,1), opacity 220ms ease, filter 220ms ease;
    transform-origin: center;
  }
  .row .cover {
    width: 62px; height: 62px; border-radius: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: rgba(255,255,255,0.95);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .row .meta { min-width: 0; }
  .row .title { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12.5px; color: var(--dim); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.center .cover { width: 78px; height: 78px; border-radius: 20px; }
  .row.center .title { font-size: 20px; color: var(--text); }
  .row.center .sub { color: var(--accent); }

  #hub-title {
    position: absolute; top: 44px; left: 0; right: 0; text-align: center;
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
  }

  /* --- Now Playing: Schallplattenspieler (echtes Vollbild) --- */
  /* Hinweis: #screen-playing braucht KEINE eigene position-Regel — die geerbte
     .screen{position:absolute;inset:0} reicht als Positionierungskontext für
     .turntable-wrap. Ein früherer Zusatz hier hatte das überschrieben und
     dadurch das gesamte Layout kollabieren lassen. */
  .turntable-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .turntable { position: relative; width: 480px; height: 480px; }

  .disc-rotating {
    position: absolute; left: 30px; top: 30px; width: 420px; height: 420px; border-radius: 50%;
    background-size: cover; background-position: center;
    box-shadow: 0 26px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06), inset 0 0 46px rgba(0,0,0,0.35);
  }
  .disc-grooves {
    position: absolute; inset: 0; border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2.1px, rgba(0,0,0,0.30) 2.1px, rgba(0,0,0,0.30) 3px);
  }
  .disc-sheen {
    position: absolute; left: 30px; top: 30px; width: 420px; height: 420px; border-radius: 50%;
    background: conic-gradient(from 210deg, rgba(255,255,255,0.10), transparent 35%, transparent 65%, rgba(255,255,255,0.06));
    pointer-events: none;
  }

  .label {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 132px; height: 132px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .label .spindle {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #0d0e11; box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
  }
  .label .lt-title {
    font-size: 14.5px; font-weight: 800; color: #fff; line-height: 1.2; max-width: 108px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .label .lt-artist { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,0.8); margin-top: 4px; }

  .tonearm-svg { position: absolute; inset: 0; width: 480px; height: 480px; overflow: visible; }
  .arm-group { transition: transform 260ms cubic-bezier(.3,.8,.3,1); transform-origin: 405px 90px; }
  .arm-group.lifted { transform: rotate(-16deg); }

  .np-controls-pill {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: rgba(10,11,14,0.6); backdrop-filter: blur(10px);
    border-radius: 22px; padding: 12px 20px 14px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .np-time { font-size: 11.5px; color: var(--dim); font-weight: 700; }
  .np-controls { display: flex; gap: 20px; align-items: center; margin-top: 10px; }
  .np-btn {
    width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
    color: var(--text); cursor: pointer;
  }
  .np-btn.main { width: 44px; height: 44px; background: var(--accent); color: #06120d; font-size: 15px; }

  /* --- Settings --- */
  #settings-list { width: 300px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;

    padding: 10px 14px; border-radius: 14px; background: var(--card);
    font-size: 13.5px; font-weight: 700;
  }
  .setting-row.sel { background: #262b35; box-shadow: 0 0 0 2px var(--accent) inset; }
  .setting-val { color: var(--dim); font-weight: 700; font-size: 12.5px; }
  .toggle-pill { width: 34px; height: 18px; border-radius: 10px; background: #333844; position: relative; }
  .toggle-pill.on { background: var(--accent); }
  .toggle-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left 150ms ease; }
  .toggle-pill.on .toggle-knob { left: 18px; }

  #hints { max-width: 480px; text-align: center; font-size: 12.5px; color: #8a8a92; line-height: 1.6; }
  #hints b { color: var(--text); }
  kbd { background: #16161a; border: 1px solid #2a2a2e; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #f2f3f6;}
</style>
</head>
<body>
<div id="device">
  <div class="statusbar" id="statusbar"></div>

  <div class="screen active" id="screen-home">
    <div id="hub-title">Mini-Musikplayer</div>
    <div id="carousel-home"></div>
  </div>
  <div class="screen" id="screen-library">
    <div id="hub-title-lib" class="hub-title-fixed" style="position:absolute;top:44px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8d93a3;">Bibliothek</div>
    <div id="carousel-library" style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;"></div>
  </div>
  <div class="screen" id="screen-playlist">
    <div id="hub-title-pl" style="position:absolute;top:44px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8d93a3;"></div>
    <div id="carousel-playlist" style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;"></div>
  </div>
  <div class="screen" id="screen-playing">
    <div id="playing-content"></div>
  </div>
  <div class="screen" id="screen-settings">
    <div style="position:absolute;top:44px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8d93a3;">Einstellungen</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;">
      <div id="settings-list"></div>
    </div>
  </div>
</div>
<div id="hints">
  <b>Variante 2 — Vertical Card Carousel</b><br>
  <kbd>&uarr;</kbd><kbd>&darr;</kbd> navigieren &nbsp;·&nbsp; <kbd>Enter</kbd> öffnen &nbsp;·&nbsp;
  <kbd>Backspace</kbd> zurück &nbsp;·&nbsp; <kbd>Space</kbd> Play/Pause &nbsp;·&nbsp; Karten klickbar
</div>

<script>
"use strict";

const LIBRARY = [
  ["Liked Songs", [["Blinding Lights","The Weeknd",200],["Levitating","Dua Lipa",203],["As It Was","Harry Styles",167],["Get Lucky","Daft Punk ft. Pharrell",248],["Redbone","Childish Gambino",327]]],
  ["Techno Mix", [["One More Time","Daft Punk",320],["D.A.N.C.E.","Justice",203],["Formula","Charlotte de Witte",300],["In My Mind","Amelie Lens",360],["Your Mind","Adam Beyer",390],["Galvanize","The Chemical Brothers",250]]],
  ["Roadtrip", [["Go Your Own Way","Fleetwood Mac",218],["Free Fallin'","Tom Petty",255],["Hotel California","Eagles",390],["Born to Run","Bruce Springsteen",270]]],
  ["Lo-Fi Focus", [["Aruarian Dance","Nujabes",236],["Feather","Nujabes",252],["Time: The Donut of the Heart","J Dilla",120],["Lonely","Tomppabeats",150],["Petals","Idealism",180]]],
  ["90s Rock", [["Smells Like Teen Spirit","Nirvana",301],["Wonderwall","Oasis",258],["Californication","Red Hot Chili Peppers",321],["Karma Police","Radiohead",261]]],
  ["Chill Sunday", [["Come Away With Me","Norah Jones",203],["Skinny Love","Bon Iver",238],["Heartbeats","José González",161]]],
  ["Workout", [["Eye of the Tiger","Survivor",244],["Till I Collapse","Eminem",297],["Stronger","Kanye West",312],["Can't Hold Us","Macklemore & Ryan Lewis",258],["Firestarter","The Prodigy",279]]],
  ["Jazz Nights", [["So What","Miles Davis",544],["Blue Train","John Coltrane",643],["Waltz for Debby","Bill Evans",414]]],
];
const PLAYLIST_COLORS = ["#FF6157","#2F8CFF","#FFB020","#34D399","#FB5A9D","#22D3C7","#A7D129","#8B7CF6"];

function fmtTime(s){ const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m}:${String(sec).padStart(2,"0")}`; }
function initials(label){ return label.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)+Math.round(255*pct/100), g=((n>>8)&255)+Math.round(255*pct/100), b=(n&255)+Math.round(255*pct/100);
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return `#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
}

// ---------------------------------------------------------------------------
// Cover-Art-Generator — abstrakte, deterministische Cover pro Track/Playlist
// (prozedural erzeugt, keine echten/urheberrechtlich geschützten Bilder nötig,
// da die Bands/Songs ohnehin fiktiv sind)
// ---------------------------------------------------------------------------
function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

const coverArtCache = new Map();

function coverArtURI(seedKey, colorA, colorB) {
  if (coverArtCache.has(seedKey)) return coverArtCache.get(seedKey);
  const rng = hashSeed(seedKey);
  const W = 240;
  const nBlobs = 2 + Math.floor(rng() * 2);
  const blobs = [];
  for (let i = 0; i < nBlobs; i++) {
    blobs.push({
      cx: 30 + rng() * (W - 60),
      cy: 30 + rng() * (W - 60),
      r: 55 + rng() * 75,
      color: i % 2 === 0 ? colorB : colorA,
      op: 0.38 + rng() * 0.28,
    });
  }
  const angle = Math.floor(rng() * 360);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${W}" viewBox="0 0 ${W} ${W}">
<defs>
  <linearGradient id="g" gradientTransform="rotate(${angle} 0.5 0.5)">
    <stop offset="0" stop-color="${colorA}"/>
    <stop offset="1" stop-color="${shade(colorB,-20)}"/>
  </linearGradient>
  <filter id="b"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="${W}" height="${W}" fill="url(#g)"/>
<g filter="url(#b)">${blobs.map(b=>`<circle cx="${b.cx.toFixed(1)}" cy="${b.cy.toFixed(1)}" r="${b.r.toFixed(1)}" fill="${b.color}" fill-opacity="${b.op.toFixed(2)}"/>`).join("")}</g>
<rect width="${W}" height="${W}" fill="rgba(0,0,0,0.10)"/>
</svg>`;
  const uri = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  coverArtCache.set(seedKey, uri);
  return uri;
}

let batteryPct = 76, btConnected = true, lastPlayed = null;

const SCREEN_HOME="home", SCREEN_LIBRARY="library", SCREEN_PLAYLIST="playlist", SCREEN_SETTINGS="settings", SCREEN_PLAYING="playing";
let screen = SCREEN_HOME;
let homeSel=0, librarySel=0, playlistSel=0, settingsSel=0, currentPlaylistIdx=0;
let nowPlaying = null;

const SETTINGS_ITEMS = [
  { key:"wifi", label:"WLAN", type:"toggle", value:true },
  { key:"bt", label:"Bluetooth", type:"toggle", value:true },
  { key:"brightness", label:"Helligkeit", type:"stepper", value:3, max:5 },
  { key:"sync", label:"Sync starten", type:"action" },
  { key:"about", label:"Über", type:"info", detail:"Rev 3" },
];

class NowPlaying {
  constructor(tracks, index, playlistIdx) {
    this.tracks = tracks; this.index = index; this.playlistIdx = playlistIdx;
    this.playing = true; this.position = 0; this.lastTick = performance.now();
  }
  current(){ return this.tracks[this.index]; }
  toggle(){ this.playing = !this.playing; this.lastTick = performance.now(); }
  skip(d){ this.index=(this.index+d+this.tracks.length)%this.tracks.length; this.position=0; }
  update(){
    const now = performance.now(); const dt=(now-this.lastTick)/1000; this.lastTick=now;
    if (this.playing) { this.position += dt; const dur=this.current()[2]; if (this.position>=dur) this.skip(1); }
  }
}

function homeItems() {
  const items = [{ label:"Bibliothek", sub:"Alle Playlists durchsuchen", kind:"library", color:"#3a3d46", isNav:true, icon:"♪" }];
  if (lastPlayed) {
    const t = LIBRARY[lastPlayed.playlistIdx][1][lastPlayed.trackIdx];
    items.push({ label:t[0], sub:"Fortsetzen · "+LIBRARY[lastPlayed.playlistIdx][0], kind:"resume", color: PLAYLIST_COLORS[lastPlayed.playlistIdx], seed:`tr-${LIBRARY[lastPlayed.playlistIdx][0]}-${t[0]}` });
  }
  items.push({ label:"Einstellungen", sub:"WLAN, Bluetooth, mehr", kind:"settings", color:"#3a3d46", isNav:true, icon:"⚙" });
  return items;
}

function renderStatusbar() {
  const el = document.getElementById("statusbar");
  el.innerHTML = `
    <span class="batt"><span class="batt-shell"><span class="batt-fill" style="width:${Math.max(2,(batteryPct/100)*14)}px"></span></span>${batteryPct}%</span>
    <span class="dot"></span>
    <span class="${btConnected ? 'bt-on' : ''}">${btConnected ? "BT" : "—"}</span>
  `;
}

function renderCarousel(containerId, items, selectedIdx, onOpen, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  const rowH = 78;
  items.forEach((item, i) => {
    const row = document.createElement("div");
    const offset = i - selectedIdx;
    const isCenter = offset === 0;
    row.className = "row" + (isCenter ? " center" : "");
    row.style.top = "50%";
    row.style.transform = `translate(-50%, calc(-50% + ${offset * rowH}px)) scale(${isCenter ? 1 : Math.max(0.72, 1 - Math.abs(offset)*0.14)})`;
    row.style.opacity = Math.max(0.15, 1 - Math.abs(offset) * 0.38);
    row.style.filter = isCenter ? "none" : `blur(${Math.min(2.5, Math.abs(offset)*0.9)}px)`;
    row.style.zIndex = 100 - Math.abs(offset);

    const cover = document.createElement("div");
    cover.className = "cover";
    if (item.isNav) {
      cover.style.background = `linear-gradient(135deg, ${item.color}, ${shade(item.color, -18)})`;
      cover.style.display = "flex"; cover.style.alignItems = "center"; cover.style.justifyContent = "center";
      cover.style.fontSize = "22px"; cover.style.fontWeight = "800"; cover.style.color = "rgba(255,255,255,0.9)";
      cover.textContent = item.icon;
    } else {
      const seed = item.seed || item.label;
      cover.style.backgroundImage = `url(${coverArtURI(seed, item.color, shade(item.color, -22))})`;
      cover.style.backgroundSize = "cover";
      cover.style.backgroundPosition = "center";
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<div class="title">${item.label}</div><div class="sub">${item.sub}</div>`;

    row.appendChild(cover); row.appendChild(meta);
    row.addEventListener("click", () => { if (i === selectedIdx) onOpen(); else onSelect(i); });
    container.appendChild(row);
  });
}

function renderHome() {
  const items = homeItems();
  if (homeSel >= items.length) homeSel = 0;
  renderCarousel("carousel-home", items, homeSel, openHomeSelection, (i)=>{homeSel=i; renderHome();});
}
function renderLibrary() {
  const items = LIBRARY.map(([name,tracks],i)=>({label:name, sub:`${tracks.length} Songs`, color:PLAYLIST_COLORS[i], seed:`pl-${name}`}));
  renderCarousel("carousel-library", items, librarySel, openLibrarySelection, (i)=>{librarySel=i; renderLibrary();});
}
function renderPlaylist() {
  const [name, tracks] = LIBRARY[currentPlaylistIdx];
  document.getElementById("hub-title-pl").textContent = name;
  const color = PLAYLIST_COLORS[currentPlaylistIdx];
  const items = tracks.map(([title,artist,dur],i)=>({label:title, sub:`${artist} · ${fmtTime(dur)}`, color, seed:`tr-${name}-${title}`}));
  renderCarousel("carousel-playlist", items, playlistSel, openPlaylistSelection, (i)=>{playlistSel=i; renderPlaylist();});
}
function renderPlayingView() {
  const [title, artist, dur] = nowPlaying.current();
  const color = PLAYLIST_COLORS[nowPlaying.playlistIdx];
  const progress = Math.min(1, nowPlaying.position / dur);

  // Tonarm-Geometrie: Nadel wandert mit Fortschritt vom äußeren Rand Richtung Label.
  // Pivot fest außerhalb der Platte, Nadelposition linear zwischen Start-/Endpunkt interpoliert.
  // Koordinaten passend zur 480x480-Vollbild-Turntable-Box (Disc-Radius 210, Label-Radius 66).
  const pivot = { x: 405, y: 90 };
  const needleStart = { x: 411, y: 133 };  // Fortschritt 0 — äußere Rille
  const needleEnd = { x: 284, y: 178 };    // Fortschritt 1 — am Label
  const nx = needleStart.x + (needleEnd.x - needleStart.x) * progress;
  const ny = needleStart.y + (needleEnd.y - needleStart.y) * progress;
  const armAngle = Math.atan2(ny - pivot.y, nx - pivot.x) * 180 / Math.PI;
  const discRotationDeg = (nowPlaying.position * (360 / 4.2)) % 360; // 1 Umdrehung / 4.2s Playtime
  const trackSeed = `tr-${LIBRARY[nowPlaying.playlistIdx][0]}-${title}`;
  const artURI = coverArtURI(trackSeed, color, shade(color, -22));

  const el = document.getElementById("playing-content");
  el.innerHTML = `
    <div class="turntable-wrap">
      <div class="turntable">
        <div class="disc-rotating" style="transform: rotate(${discRotationDeg}deg); background-image: url(${artURI});">
          <div class="disc-grooves"></div>
        </div>
        <div class="disc-sheen"></div>
        <div class="label" style="background:linear-gradient(135deg, ${color}, ${shade(color,-18)});">
          <span class="spindle"></span>
          <div class="lt-title">${title}</div>
          <div class="lt-artist">${artist}</div>
        </div>
        <svg class="tonearm-svg" viewBox="0 0 480 480">
          <circle cx="${pivot.x}" cy="${pivot.y}" r="9" fill="#2a2d35" stroke="#484c56" stroke-width="1.5" />
          <g class="arm-group ${nowPlaying.playing ? '' : 'lifted'}">
            <line x1="${pivot.x}" y1="${pivot.y}" x2="${nx}" y2="${ny}" stroke="#c7cad2" stroke-width="3.8" stroke-linecap="round" />
            <g transform="translate(${nx} ${ny}) rotate(${armAngle})">
              <rect x="-3" y="-7" width="16" height="14" rx="3.5" fill="#9aa0ac" />
              <circle cx="14" cy="0" r="2.4" fill="${color}" />
            </g>
          </g>
        </svg>
      </div>
      <div class="np-controls-pill">
        <div class="np-time">${fmtTime(nowPlaying.position)} / ${fmtTime(dur)}</div>
        <div class="np-controls">
          <div class="np-btn" id="np-prev">«</div>
          <div class="np-btn main" id="np-toggle">${nowPlaying.playing ? "II" : "▶"}</div>
          <div class="np-btn" id="np-next">»</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("np-toggle").addEventListener("click", () => { nowPlaying.toggle(); renderPlayingView(); });
  document.getElementById("np-prev").addEventListener("click", () => { nowPlaying.skip(-1); renderPlayingView(); });
  document.getElementById("np-next").addEventListener("click", () => { nowPlaying.skip(1); renderPlayingView(); });
}
function renderSettings() {
  const el = document.getElementById("settings-list");
  el.innerHTML = "";
  SETTINGS_ITEMS.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "setting-row" + (i===settingsSel ? " sel" : "");
    let valHtml;
    if (s.type === "toggle") valHtml = `<span class="toggle-pill ${s.value?'on':''}"><span class="toggle-knob"></span></span>`;
    else if (s.type === "stepper") valHtml = `<span class="setting-val">${"●".repeat(s.value)}${"○".repeat(s.max-s.value)}</span>`;
    else if (s.type === "info") valHtml = `<span class="setting-val">${s.detail}</span>`;
    else valHtml = `<span class="setting-val">→</span>`;
    row.innerHTML = `<span>${s.label}</span>${valHtml}`;
    row.addEventListener("click", () => { settingsSel=i; activateSetting(); renderSettings(); });
    el.appendChild(row);
  });
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
}

function render() {
  renderStatusbar();
  showScreen(screen);
  if (screen===SCREEN_HOME) renderHome();
  else if (screen===SCREEN_LIBRARY) renderLibrary();
  else if (screen===SCREEN_PLAYLIST) renderPlaylist();
  else if (screen===SCREEN_SETTINGS) renderSettings();
  else if (screen===SCREEN_PLAYING) renderPlayingView();
}

function openHomeSelection() {
  const items = homeItems();
  const kind = items[homeSel].kind;
  if (kind==="library") { screen=SCREEN_LIBRARY; librarySel=0; }
  else if (kind==="settings") { screen=SCREEN_SETTINGS; settingsSel=0; }
  else if (kind==="resume") {
    currentPlaylistIdx = lastPlayed.playlistIdx;
    nowPlaying = new NowPlaying(LIBRARY[currentPlaylistIdx][1], lastPlayed.trackIdx, currentPlaylistIdx);
    screen = SCREEN_PLAYING;
  }
  render();
}
function openLibrarySelection() { currentPlaylistIdx=librarySel; playlistSel=0; screen=SCREEN_PLAYLIST; render(); }
function openPlaylistSelection() {
  nowPlaying = new NowPlaying(LIBRARY[currentPlaylistIdx][1], playlistSel, currentPlaylistIdx);
  lastPlayed = { playlistIdx: currentPlaylistIdx, trackIdx: playlistSel };
  screen = SCREEN_PLAYING; render();
}
function activateSetting() {
  const s = SETTINGS_ITEMS[settingsSel];
  if (s.type==="toggle") s.value=!s.value;
  else if (s.type==="stepper") s.value = s.value>=s.max ? 1 : s.value+1;
  else if (s.type==="action") s.detail = "Fertig ✓";
}

window.addEventListener("keydown",(e)=>{
  if (screen===SCREEN_HOME) {
    const n = homeItems().length;
    if (e.key==="ArrowDown") { homeSel=(homeSel+1)%n; renderHome(); e.preventDefault(); }
    else if (e.key==="ArrowUp") { homeSel=(homeSel-1+n)%n; renderHome(); e.preventDefault(); }
    else if (e.key==="Enter") { openHomeSelection(); e.preventDefault(); }
  } else if (screen===SCREEN_LIBRARY) {
    const n = LIBRARY.length;
    if (e.key==="ArrowDown") { librarySel=(librarySel+1)%n; renderLibrary(); e.preventDefault(); }
    else if (e.key==="ArrowUp") { librarySel=(librarySel-1+n)%n; renderLibrary(); e.preventDefault(); }
    else if (e.key==="Enter") { openLibrarySelection(); e.preventDefault(); }
    else if (e.key==="Backspace"||e.key==="Escape") { screen=SCREEN_HOME; render(); e.preventDefault(); }
  } else if (screen===SCREEN_PLAYLIST) {
    const n = LIBRARY[currentPlaylistIdx][1].length;
    if (e.key==="ArrowDown") { playlistSel=(playlistSel+1)%n; renderPlaylist(); e.preventDefault(); }
    else if (e.key==="ArrowUp") { playlistSel=(playlistSel-1+n)%n; renderPlaylist(); e.preventDefault(); }
    else if (e.key==="Enter") { openPlaylistSelection(); e.preventDefault(); }
    else if (e.key==="Backspace"||e.key==="Escape") { screen=SCREEN_LIBRARY; render(); e.preventDefault(); }
  } else if (screen===SCREEN_SETTINGS) {
    const n = SETTINGS_ITEMS.length;
    if (e.key==="ArrowDown") { settingsSel=(settingsSel+1)%n; renderSettings(); e.preventDefault(); }
    else if (e.key==="ArrowUp") { settingsSel=(settingsSel-1+n)%n; renderSettings(); e.preventDefault(); }
    else if (e.key==="Enter") { activateSetting(); renderSettings(); e.preventDefault(); }
    else if (e.key==="Backspace"||e.key==="Escape") { screen=SCREEN_HOME; render(); e.preventDefault(); }
  } else if (screen===SCREEN_PLAYING) {
    if (e.key===" ") { nowPlaying.toggle(); renderPlayingView(); e.preventDefault(); }
    else if (e.key==="ArrowRight") { nowPlaying.skip(1); renderPlayingView(); e.preventDefault(); }
    else if (e.key==="ArrowLeft") { nowPlaying.skip(-1); renderPlayingView(); e.preventDefault(); }
    else if (e.key==="Backspace"||e.key==="Escape") { screen=SCREEN_PLAYLIST; render(); e.preventDefault(); }
  }
});

let lastFrame = performance.now();
function loop() {
  if (screen===SCREEN_PLAYING && nowPlaying) { nowPlaying.update(); renderPlayingView(); }
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
